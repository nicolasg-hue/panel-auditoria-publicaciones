<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Auditoría de Publicaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS
   ========================================================================== */
:root{
  --bg:#FAF9F6;
  --surface:#FFFFFF;
  --surface-2:#F3F1EC;
  --border:#E7E3DA;
  --border-soft:#F0EDE6;
  --ink:#1B1A17;
  --ink-soft:#6E6A62;
  --ink-faint:#A6A199;

  --ml:#B9822C;
  --ml-strong:#8C6220;
  --ml-soft:#FBF1DE;
  --ml-ring:#E2A03F;

  --web:#3E6FF0;
  --web-strong:#2C52C4;
  --web-soft:#EAF0FE;

  --ok:#1F9D55;
  --ok-soft:#E7F6ED;
  --review:#8A63D2;
  --review-soft:#F1ECFB;
  --warn:#D97706;
  --warn-soft:#FCF1DF;
  --danger:#E5484D;
  --danger-soft:#FCEBEC;

  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(27,26,23,0.04), 0 1px 1px rgba(27,26,23,0.03);
  --shadow-md:0 8px 24px rgba(27,26,23,0.07);
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
::selection{background:var(--ml-soft);}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important;}
}

/* ==========================================================================
   LAYOUT SHELL
   ========================================================================== */
.app-shell{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:16px;
  padding:12px 24px;
  background:rgba(250,249,246,0.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar .brand{
  display:flex; align-items:center; gap:10px;
  font-weight:700; font-size:15px; letter-spacing:-0.01em;
  cursor:pointer; user-select:none;
}
.brand .mark{
  width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--ml-ring),var(--web));
  display:flex;align-items:center;justify-content:center;
  color:white;font-family:var(--font-mono);font-size:11px;font-weight:700;
}
.topbar .crumbs{color:var(--ink-soft); font-size:13px; display:flex; align-items:center; gap:6px;}
.topbar .crumbs .sep{color:var(--ink-faint);}
.topbar .crumbs .active{color:var(--ink); font-weight:600;}
.topbar-spacer{flex:1;}
.user-select{
  display:flex; align-items:center; gap:8px;
  padding:6px 10px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface); font-size:13px; cursor:pointer;
}
.user-select select{border:none; background:transparent; font-family:inherit; font-size:13px; color:var(--ink); cursor:pointer;}
.avatar{
  width:22px;height:22px;border-radius:50%;
  background:var(--surface-2); display:flex;align-items:center;justify-content:center;
  font-size:10px; font-weight:700; color:var(--ink-soft);
}

.main{flex:1; padding:28px 24px 80px; max-width:1180px; width:100%; margin:0 auto;}

/* ==========================================================================
   HOME — dos tarjetas grandes
   ========================================================================== */
.home-header{margin-bottom:22px;}
.home-header h1{font-size:22px; margin:0 0 4px; letter-spacing:-0.02em;}
.home-header p{margin:0; color:var(--ink-soft); font-size:14px;}

.channel-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:18px;
}
@media (max-width:760px){ .channel-grid{grid-template-columns:1fr;} }

.channel-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:24px; cursor:pointer; position:relative; overflow:hidden;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.channel-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.channel-card:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
.channel-card.ml{border-top:3px solid var(--ml-ring);}
.channel-card.web{border-top:3px solid var(--web);}

.channel-card .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.channel-card .title{display:flex; align-items:center; gap:10px; font-size:16px; font-weight:700;}
.dot{width:9px;height:9px;border-radius:50%;}
.dot.ml{background:var(--ml-ring);}
.dot.web{background:var(--web);}
.channel-card .pct{font-family:var(--font-mono); font-size:26px; font-weight:700;}

.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px;}
.stat{
  background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px;
}
.stat .n{font-family:var(--font-mono); font-size:18px; font-weight:700; display:block;}
.stat .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}

.progress-track{height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden;}
.progress-fill{height:100%; border-radius:6px; transition:width .4s ease;}
.progress-fill.ml{background:linear-gradient(90deg,var(--ml-ring),var(--ml-strong));}
.progress-fill.web{background:linear-gradient(90deg,var(--web),var(--web-strong));}

/* ==========================================================================
   FILTER BAR + LIST
   ========================================================================== */
.list-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
.back-btn{
  border:1px solid var(--border); background:var(--surface); border-radius:10px;
  padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink);
  display:flex; align-items:center; gap:6px;
}
.back-btn:hover{background:var(--surface-2);}

.filters{
  display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
  background:var(--surface); border:1px solid var(--border); padding:12px; border-radius:var(--radius-md);
}
.filters select, .filters input[type="text"]{
  border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px;
  background:var(--surface); color:var(--ink); font-family:inherit;
}
.filters input[type="text"]{min-width:170px;}
.view-tabs{display:flex; gap:4px; margin-left:auto;}
.view-tabs button{
  border:1px solid var(--border); background:var(--surface); padding:6px 12px; border-radius:8px;
  font-size:12.5px; cursor:pointer; color:var(--ink-soft); font-weight:600;
}
.view-tabs button.active{background:var(--ink); color:white; border-color:var(--ink);}

.item-list{display:flex; flex-direction:column; gap:8px;}
.item-row{
  display:grid; grid-template-columns:14px 110px 100px 1fr 130px 110px 90px 70px; align-items:center; gap:14px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:12px 16px; cursor:pointer; transition:border-color .12s ease, background .12s ease;
}
.prioridad-dot{width:11px; height:11px; border-radius:50%; display:inline-block; flex-shrink:0;}
.item-row:hover{border-color:var(--ink-faint); background:var(--surface-2);}
@media (max-width:900px){
  .item-row{grid-template-columns:14px 1fr; gap:6px;}
  .item-row .col-hide-mobile{display:none;}
}
.mono{font-family:var(--font-mono);}
.item-row .mla{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft);}
.item-row .producto{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-row .meta{font-size:12px; color:var(--ink-soft);}

.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px;
  font-size:11.5px; font-weight:600; white-space:nowrap;
}
.badge::before{content:''; width:6px;height:6px;border-radius:50%;}
.badge.pendiente{background:var(--surface-2); color:var(--ink-soft);}
.badge.pendiente::before{background:var(--ink-faint);}
.badge.revision{background:var(--review-soft); color:var(--review);}
.badge.revision::before{background:var(--review);}
.badge.cambios{background:var(--danger-soft); color:var(--danger);}
.badge.cambios::before{background:var(--danger);}
.badge.optimizada{background:var(--ok-soft); color:var(--ok);}
.badge.optimizada::before{background:var(--ok);}

.score-pill{
  font-family:var(--font-mono); font-weight:700; font-size:12.5px;
  padding:3px 8px; border-radius:8px; background:var(--surface-2);
}
.empty-state{
  text-align:center; padding:60px 20px; color:var(--ink-soft);
  border:1px dashed var(--border); border-radius:var(--radius-lg);
}
.empty-state h3{color:var(--ink); margin-bottom:6px;}

/* ==========================================================================
   FICHA DE AUDITORÍA (detail)
   ========================================================================== */
.detail-header{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:20px 22px; margin-bottom:18px; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.detail-header .id-block .mla{font-family:var(--font-mono); font-size:13px; color:var(--ink-soft);}
.detail-header .id-block h2{margin:2px 0 8px; font-size:19px; letter-spacing:-0.01em; max-width:560px;}
.detail-header .chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{font-size:11.5px; padding:3px 9px; border-radius:8px; background:var(--surface-2); color:var(--ink-soft); font-weight:600;}

.score-gauge{display:flex; flex-direction:column; align-items:center; gap:4px; min-width:110px;}
.score-gauge svg{transform:rotate(-90deg);}
.score-gauge .value{font-family:var(--font-mono); font-weight:700; font-size:20px; position:relative; margin-top:-72px;}
.score-gauge .label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:38px;}

.confirm-btn{
  border:none; background:var(--ok); color:white; font-weight:700; font-size:13.5px;
  padding:10px 16px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:8px;
  box-shadow:var(--shadow-sm);
}
.confirm-btn:hover{background:#188045;}
.confirm-btn:disabled{background:var(--ink-faint); cursor:not-allowed;}

.checklist-sections{display:flex; flex-direction:column; gap:14px;}
.section-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px;
}
.section-card h3{margin:0 0 14px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
.section-card h3 .count{font-family:var(--font-mono); font-weight:500; color:var(--ink-soft); font-size:12px;}

.field-row{
  display:grid; grid-template-columns:220px 1fr; gap:16px; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--border-soft);
}
.field-row:last-child{border-bottom:none;}
.field-row label{font-size:13px; font-weight:500; color:var(--ink);}

.chip-toggle{display:flex; gap:6px; flex-wrap:wrap;}
.chip-toggle button{
  border:1px solid var(--border); background:var(--surface); padding:6px 12px; border-radius:8px;
  font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); transition:all .12s ease;
}
.chip-toggle button.active{background:var(--surface-2); color:var(--ink); border-color:var(--ink-faint);}
.chip-toggle button[data-val="OK"].active{background:var(--ok-soft); color:var(--ok); border-color:var(--ok);}
.chip-toggle button[data-val="Pendiente"].active{background:var(--surface-2); color:var(--ink); border-color:var(--ink-faint);}
.chip-toggle button[data-val="Incorrecto"].active{background:var(--danger-soft); color:var(--danger); border-color:var(--danger);}
.chip-toggle button[data-val="Completa"].active{background:var(--ok-soft); color:var(--ok); border-color:var(--ok);}
.chip-toggle button[data-val="Incompleta"].active{background:var(--danger-soft); color:var(--danger); border-color:var(--danger);}

.field-row textarea, .field-row input[type="text"]{
  width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px;
  font-family:inherit; font-size:13px; resize:vertical; min-height:38px; background:var(--surface);
}
.field-row textarea:focus, .field-row input:focus{outline:2px solid var(--ml-ring); outline-offset:-1px;}

.save-dot{width:6px;height:6px;border-radius:50%; background:var(--ink-faint); display:inline-block; margin-left:6px;}
.save-dot.saved{background:var(--ok);}
.save-dot.saving{background:var(--warn);}

.field-content{display:flex; flex-direction:column; gap:8px;}
.field-content-top{display:flex; align-items:center; flex-wrap:wrap; gap:8px;}
.ai-prompt-btn{
  border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
  padding:6px 11px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.ai-prompt-btn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--ink-faint);}
.ai-prompt-btn:disabled{opacity:.55; cursor:not-allowed;}
.ai-prompt-box{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:10px 12px; font-size:12px; line-height:1.5; white-space:pre-wrap;
  display:none; max-height:220px; overflow-y:auto;
}
.ai-prompt-box.open{display:block;}
.ai-prompt-box.error{color:var(--danger);}
.ai-prompt-box .copy-mini{
  display:inline-block; margin-top:8px; font-size:11.5px; font-weight:700;
  background:var(--surface); border:1px solid var(--border); border-radius:6px;
  padding:4px 10px; cursor:pointer; color:var(--ink);
}
.ai-prompt-box .copy-mini:hover{background:var(--surface-2);}
.mini-spinner{
  width:11px; height:11px; border-radius:50%; border:2px solid var(--border);
  border-top-color:var(--web); display:inline-block; animation:spin .7s linear infinite;
}
.suggest-actions{display:flex; gap:8px; margin-top:10px;}
.suggest-actions button{
  font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:7px;
  border:1px solid var(--border); cursor:pointer; background:var(--surface); color:var(--ink);
}
.suggest-actions .use-btn{background:var(--ok); color:#fff; border-color:var(--ok);}
.suggest-actions .use-btn:hover{background:#188045;}
.suggest-actions .discard-btn{color:var(--ink-soft); background:transparent;}
.suggest-actions .discard-btn:hover{background:var(--surface-2);}
.char-counter{
  font-size:11px; font-weight:600; margin-top:4px; display:inline-block;
}
.char-counter.ok{color:var(--ok);}
.char-counter.warn{color:var(--warn);}
.char-counter.danger{color:var(--danger);}
.modal.wide{max-width:640px;}
.resumen-range{color:var(--ink-soft); font-size:12.5px; margin-bottom:14px;}
.resumen-table{width:100%; border-collapse:collapse; font-size:13px;}
.resumen-table th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--ink-soft); padding:6px 8px; border-bottom:1px solid var(--border);
}
.resumen-table td{padding:8px; border-bottom:1px solid var(--border-soft);}
.resumen-table tr:last-child td{border-bottom:none;}
.resumen-table td.num{font-family:var(--font-mono); text-align:right;}
.resumen-total{
  display:flex; justify-content:space-between; margin-top:14px; padding-top:12px;
  border-top:1px solid var(--border); font-size:13px; font-weight:700;
}
.pubnueva-resumen{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:14px 18px; margin-bottom:18px; font-size:14px;
}
.pubnueva-contador{font-size:13px; font-weight:600;}
.pubnueva-contador.completo{color:var(--ok);}
.pubnueva-contador.incompleto{color:var(--warn);}
.pubnueva-sugerencia{
  display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  background:#f5f3ff; border:1px solid #ddd6fe; border-radius:var(--radius-md);
  padding:12px 16px; margin:-8px 0 18px; font-size:13px;
}
.pubnueva-sugerencia code{background:#fff; padding:1px 6px; border-radius:4px; font-size:12px;}

.obs-general textarea{min-height:90px;}

.nav-footer{
  position:sticky; bottom:0; margin-top:22px; padding:14px 0; background:linear-gradient(180deg,rgba(250,249,246,0),var(--bg) 30%);
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.nav-footer .group{display:flex; gap:8px;}
.nav-btn{
  border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 14px;
  font-size:13px; font-weight:600; cursor:pointer; color:var(--ink);
}
.nav-btn:hover{background:var(--surface-2);}
.nav-btn.primary{background:var(--ink); color:white; border-color:var(--ink);}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:white; padding:10px 18px; border-radius:10px; font-size:13px;
  box-shadow:var(--shadow-md); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  z-index:100;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(27,26,23,0.4); display:flex; align-items:center; justify-content:center;
  z-index:200; padding:20px;
}
.modal{
  background:var(--surface); border-radius:var(--radius-lg); padding:24px; max-width:420px; width:100%;
  box-shadow:var(--shadow-md);
}
.modal h3{margin-top:0;}
.modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
.loading-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:120px 20px; color:var(--ink-soft); gap:10px;}
.spinner{
  width:26px; height:26px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--ml-ring);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/modules/shell-bridge.js"></script>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="brand" id="brandHome" tabindex="0">
      <span class="mark">PA</span>
      <span>Panel de Auditoría</span>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="topbar-spacer"></div>
    <button class="back-btn" id="btnSolicitudNueva" style="margin-right:4px;">📋 Solicitar publicación nueva</button>
    <button class="back-btn" id="btnPublicacionesNuevas" style="margin-right:4px;">🆕 Publicaciones nuevas</button>
    <button class="back-btn" id="btnResumen" style="margin-right:4px;">📊 Resumen semanal</button>
    <div class="user-select">
      <span class="avatar" id="userAvatar">–</span>
      <select id="userSelect" aria-label="Usuario activo"></select>
    </div>
  </header>

  <main class="main" id="main">
    <div class="loading-screen"><div class="spinner"></div><span>Cargando publicaciones…</span></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   CONFIGURACIÓN DE CONEXIÓN
   ============================================================================
   Pegá acá la URL de tu Web App de Apps Script (Implementar > Nueva
   implementación). Si la dejás vacía, la app corre en MODO DEMO con datos
   de ejemplo en memoria para que puedas revisar el diseño y el flujo antes
   de conectar Google Sheets.
   ========================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxG3FRq5QZjiAhMNwXktTY1ygWTN70OJRv84jrFCf7o5fbMVJHyEQq-bnuTiJjK-z8k0A/exec'; // ej: 'https://script.google.com/macros/s/XXXXX/exec'
// Mismo token que se guarda en Propiedades del script (Apps Script), como
// GEMINI_API_KEY. Viaja en cada pedido para que el backend sepa que es una
// llamada autorizada (panel, equipo, o el Superagente que se conecte).
const API_TOKEN = 'uZ-FQ9onY3gNaLfauIJ-vLuYtqE18Mh-_Z2Y_iLC9Vo';

/* ============================================================================
   ESTADO GLOBAL
   ========================================================================== */
const state = {
  config: { campos: [], listas: {} },
  data: { mercadolibre: [], web: [] },
  view: 'home',        // home | list | detail | publicacionesNuevas
  canal: 'ML',          // ML | Web
  filters: { estado: 'pendientes', categoria: '', responsable: '', q: '', fecha: '', prioridad: '' },
  currentIndex: 0,
  currentUser: '',
  pendingSaves: 0,
  plantillas: null,     // se carga bajo demanda: { categorias, camposPorCategoria }
  pubNueva: { categoria: '', codigoTemp: '', campos: {}, vinculacion: {}, estadoBorrador: '' },
  pubNuevaCodigoTentativo: '',
  pubNuevaSugerencia: null,  // { categoria, prefijo, coincidencias, buscado }
  solicitudes: null,         // se carga bajo demanda
  nuevaSolicitud: { categoria: '', motivo: '', cantidadSkus: '', observaciones: '', ejecutivoAsignado: '' }
};

const ESTADOS_BASE = ['Pendiente', 'En revisión', 'Requiere cambios', 'Optimizada'];
const ESTADO_CLASS = {
  'Pendiente': 'pendiente', 'En revisión': 'revision',
  'Requiere cambios': 'cambios', 'Optimizada': 'optimizada'

/* ============================================================================
   JSONP — evita el bloqueo de CORS que sufren algunas cuentas de
   Google Workspace con fetch() contra Apps Script. Una etiqueta <script>
   dinámica no está sujeta a la política CORS del navegador.
   ========================================================================== */
// Proxy en Lovable Cloud: reenvía el pedido server-side hacia Apps Script,
// sin que el navegador de quien usa el panel le hable directo a Google —
// así evitamos el bloqueo de acceso que afecta a algunas cuentas de
// Workspace, sin importar desde dónde se abra este index.html.
const PROXY_URL = 'https://nexus-hub-65.lovable.app/api/public/optimizacion/proxy';

function jsonpRequest(params){
  const paramsConToken = Object.assign({}, params, { token: API_TOKEN });
  const query = Object.keys(paramsConToken)
    .filter(k => paramsConToken[k] !== undefined && paramsConToken[k] !== null)
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(paramsConToken[k]))
    .join('&');

  return fetchViaProxy(query).catch(() => fetchViaJsonpDirecto(query));
}

async function fetchViaProxy(query){
  const res = await fetch(PROXY_URL + '?' + query);
  if (!res.ok) throw new Error('Proxy respondió ' + res.status);
  return res.json();
}

function fetchViaJsonpDirecto(query){
  return new Promise((resolve, reject) => {
    const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const cleanup = () => { delete window[cbName]; script.remove(); };
    window[cbName] = (data) => { cleanup(); resolve(data); };

    const script = document.createElement('script');
    script.src = API_URL + '?' + query + '&callback=' + cbName;
    script.onerror = () => { cleanup(); reject(new Error('No se pudo conectar con el servidor (revisá la URL o el despliegue)')); };
    document.body.appendChild(script);
  });
}

/* ============================================================================
   CARGA DE DATOS
   ========================================================================== */
async function loadData(){
  try {
    if (!API_URL){
      const demo = buildDemoData();
      applyData(demo);
      showToast('Modo demo: configurá API_URL para conectar Google Sheets');
      return;
    }
    const json = await jsonpRequest({ action: 'getAll' });
    if (json.error) throw new Error(json.error);
    applyData(json);
  } catch (err){
    document.getElementById('main').innerHTML =
      '<div class="empty-state"><h3>No se pudo cargar la información</h3><p>' +
      escapeHtml(err.message) + '</p></div>';
  }
}

function applyData(json){
  state.config = json.config || { campos: [], listas: {} };
  state.data.mercadolibre = json.mercadolibre || [];
  state.data.web = json.web || [];

  const usuarios = state.config.listas.usuarios || ['Usuario'];
  const userSelect = document.getElementById('userSelect');
  userSelect.innerHTML = usuarios.map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join('');
  // Si ya había un usuario activo elegido (ej. al refrescar tras una
  // asignación masiva) y sigue existiendo en la lista, lo mantenemos en
  // vez de resetear siempre al primero de la lista.
  state.currentUser = (state.currentUser && usuarios.includes(state.currentUser))
    ? state.currentUser
    : (usuarios[0] || 'Usuario');
  userSelect.value = state.currentUser;
  updateAvatar();
  if (!userSelect._listenerAttached){
    userSelect.addEventListener('change', () => {
      state.currentUser = userSelect.value;
      updateAvatar();
    });
    userSelect._listenerAttached = true;
  }

  render();
}

function updateAvatar(){
  const initials = (state.currentUser || '?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('userAvatar').textContent = initials || '?';
}

/* ============================================================================
   HELPERS
   ========================================================================== */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(d){
  if (!d) return '—';
  const date = new Date(d);
  if (isNaN(date)) return '—';
  return date.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
  // Si corre embebido dentro del portal de Lovable, además avisamos por el
  // bridge para que se vea como notificación unificada del shell. Es un
  // no-op fuera del iframe (standalone / GitHub Pages / local).
  if (typeof Shell !== 'undefined' && Shell.inShell){
    const esError = /error|no se pudo/i.test(msg);
    Shell.notify({ level: esError ? 'error' : 'info', message: msg });
  }
}
function getRows(canal){
  return canal === 'Web' ? state.data.web : state.data.mercadolibre;
}
function statCounts(rows){
  const c = { 'Pendiente':0, 'En revisión':0, 'Requiere cambios':0, 'Optimizada':0 };
  rows.forEach(r => { if (c[r.Estado] !== undefined) c[r.Estado]++; else c['Pendiente']++; });
  return c;
}
function avgProgress(rows){
  if (!rows.length) return 0;
  const sum = rows.reduce((a,r)=>a+(Number(r.Score)||0),0);
  return Math.round(sum/rows.length);
}

   ROUTER / RENDER
   ========================================================================== */
function goHome(){ state.view='home'; render(); }
function goList(canal){ state.canal = canal; state.view='list'; render(); }
function goDetail(canal, index){ state.canal = canal; state.currentIndex = index; state.view='detail'; render(); }

document.getElementById('brandHome').addEventListener('click', goHome);
document.getElementById('brandHome').addEventListener('keypress', e => { if (e.key==='Enter') goHome(); });

  state.view = 'publicacionesNuevas';
  render();
});
document.getElementById('btnSolicitudNueva').addEventListener('click', () => {
  state.view = 'solicitudes';
  render();
});

function render(){
  const main = document.getElementById('main');
  const crumbs = document.getElementById('crumbs');
  if (state.view === 'home'){
    crumbs.innerHTML = '';
    main.innerHTML = renderHome();
    attachHomeEvents();
    updateShellTitle('Inicio · ML y Web');
  } else if (state.view === 'list'){
    crumbs.innerHTML = `<span class="sep">/</span><span class="active">${state.canal === 'Web' ? 'Tienda Web' : 'Mercado Libre'}</span>`;
    main.innerHTML = renderList();
    attachListEvents();
    updateShellTitle(`${state.canal === 'Web' ? 'Tienda Web' : 'Mercado Libre'} · ${filteredRows().length} publicaciones`);
  } else if (state.view === 'detail'){
    crumbs.innerHTML = `<span class="sep">/</span><span>${state.canal === 'Web' ? 'Tienda Web' : 'Mercado Libre'}</span><span class="sep">/</span><span class="active">Ficha</span>`;
    main.innerHTML = renderDetail();
    attachDetailEvents();
    const list = currentFilteredList();
    const item = list[Math.min(state.currentIndex, list.length - 1)];
    updateShellTitle(item ? `Ficha · ${item.Producto || item.MLA_SKU}` : 'Ficha');
  } else if (state.view === 'publicacionesNuevas'){
    crumbs.innerHTML = `<span class="sep">/</span><span class="active">Publicaciones nuevas</span>`;
    main.innerHTML = renderPublicacionesNuevas();
    attachPublicacionesNuevasEvents();
    updateShellTitle(state.pubNueva.categoria ? `Publicaciones nuevas · ${state.pubNueva.categoria}` : 'Publicaciones nuevas');
  } else if (state.view === 'solicitudes'){
    crumbs.innerHTML = `<span class="sep">/</span><span class="active">Solicitudes de publicación</span>`;
    main.innerHTML = renderSolicitudes();
    attachSolicitudesEvents();
    updateShellTitle('Solicitudes de publicación');
  }
}

function updateShellTitle(texto){
  if (typeof Shell !== 'undefined' && Shell.inShell) Shell.setTitle(texto);
}

/* ---- HOME ---- */
function renderHome(){
  const mlRows = getRows('ML');
  const webRows = getRows('Web');
  const mlStats = statCounts(mlRows);
  const webStats = statCounts(webRows);
  const mlProg = avgProgress(mlRows);
  const webProg = avgProgress(webRows);

  const card = (canal, label, stats, prog, cls) => `
    <div class="channel-card ${cls}" data-canal="${canal}" tabindex="0" role="button">
      <div class="head">
        <div class="title"><span class="dot ${cls}"></span>${label}</div>
        <div class="pct">${prog}%</div>
      </div>
      <div class="stat-row">
        <div class="stat"><span class="n">${stats['Pendiente']}</span><span class="l">Pendientes</span></div>
        <div class="stat"><span class="n">${stats['En revisión']}</span><span class="l">En revisión</span></div>
        <div class="stat"><span class="n">${stats['Requiere cambios']}</span><span class="l">Requiere cambios</span></div>
        <div class="stat"><span class="n">${stats['Optimizada']}</span><span class="l">Optimizadas</span></div>
      </div>
      <div class="progress-track"><div class="progress-fill ${cls}" style="width:${prog}%"></div></div>
    </div>`;

  return `
    <div class="home-header">
      <h1>Publicaciones</h1>
      <p>Seleccioná un canal para auditar y optimizar publicaciones.</p>
    </div>
    <div class="channel-grid">
      ${card('ML', 'Optimización Mercado Libre', mlStats, mlProg, 'ml')}

function attachHomeEvents(){
  document.querySelectorAll('.channel-card').forEach(el => {
    el.addEventListener('click', () => goList(el.dataset.canal));
    el.addEventListener('keypress', e => { if (e.key==='Enter') goList(el.dataset.canal); });
  });
}

/* ---- LIST ---- */
function filteredRows(){
  const rows = getRows(state.canal);
  const f = state.filters;
  const filtered = rows.filter(r => {
    if (f.estado === 'pendientes' && r.Estado === 'Optimizada') return false;
    if (f.estado === 'revision' && r.Estado !== 'En revisión') return false;
    if (f.estado === 'cambios' && r.Estado !== 'Requiere cambios') return false;
    if (f.estado === 'optimizadas' && r.Estado !== 'Optimizada') return false;
    if (f.categoria && r.Categoria !== f.categoria) return false;
    if (f.responsable && r.Responsable !== f.responsable) return false;
    if (f.prioridad !== '' && Number(r._prioridad || 0) !== Number(f.prioridad)) return false;
    if (f.q){
      const q = f.q.toLowerCase();
      const hay = [r.MLA_SKU, r.SKU, r.Producto].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  // Verde (1) primero, sin pintar (0) al final — mayor urgencia de trabajo arriba.
  if (f.ordenarPorPrioridad){
    filtered.sort((a, b) => {
      const pa = Number(a._prioridad || 0) || 99;
      const pb = Number(b._prioridad || 0) || 99;
      return pa - pb;
    });
  }
  return filtered;
}

const PRIORIDAD_COLOR_FALLBACK = { 1:'#22c55e', 2:'#eab308', 3:'#f97316', 4:'#ef4444', 0:'#d1d5db' };

function renderItemRow(r, i){
  const estadoCls = ESTADO_CLASS[r.Estado] || 'pendiente';
  const nivel = Number(r._prioridad || 0);
  const colorPrioridad = r._prioridadColor && nivel > 0 ? r._prioridadColor : PRIORIDAD_COLOR_FALLBACK[nivel];
  const tituloPrioridad = r._prioridadLabel ? `Prioridad: ${r._prioridadLabel} (#${nivel})` : 'Sin prioridad asignada';
  return `
    <div class="item-row" data-index="${i}">
      <span class="prioridad-dot" style="background:${colorPrioridad}" title="${escapeHtml(tituloPrioridad)}"></span>
      <span class="mla">${escapeHtml(r.MLA_SKU || '')}</span>
      <span class="mla col-hide-mobile">${escapeHtml(r.SKU || '')}</span>
      <span class="producto">${escapeHtml(r.Producto || '')}</span>

      <span class="meta col-hide-mobile">${fmtDate(r.FechaUltimaRevision)} · ${escapeHtml(r.UltimoUsuario || '—')}</span>
      <span class="score-pill">${r.Score || 0}%</span>

  document.getElementById('fCategoria').addEventListener('change', e => { state.filters.categoria = e.target.value; render(); });
  document.getElementById('fResponsable').addEventListener('change', e => { state.filters.responsable = e.target.value; render(); });
  document.getElementById('fPrioridad').addEventListener('change', e => { state.filters.prioridad = e.target.value; render(); });
  document.getElementById('fOrdenPrioridad').addEventListener('change', e => { state.filters.ordenarPorPrioridad = e.target.checked; render(); });
  document.querySelectorAll('.view-tabs button').forEach(b => {
    b.addEventListener('click', () => { state.filters.estado = b.dataset.estado; render(); });
  });
  document.querySelectorAll('.item-row').forEach(el => {
    el.addEventListener('click', () => {
      const rows = filteredRows();
      goDetail(state.canal, Number(el.dataset.index));
      state._filteredSnapshot = rows; // para navegación siguiente/anterior
    });
  });
}

function attachSolicitudesEvents(){
  const btnHome = document.getElementById('btnBackHomeDesdeSolicitud');
  if (btnHome) btnHome.addEventListener('click', goHome);

  const campos = ['solCategoria','solMotivo','solCantidadSkus','solEjecutivo','solObservaciones'];

  campos.forEach(id => {

  if (btnEnviar) btnEnviar.addEventListener('click', enviarSolicitud);

  document.querySelectorAll('[data-confirmar-codigo]').forEach(btn => {
    btn.addEventListener('click', () => confirmarCodigoCatalogo(btn.dataset.confirmarCodigo, btn));
  });

  document.querySelectorAll('[data-crear-desde-solicitud]').forEach(btn => {

async function iniciarCreacionDesdeSolicitud(codigoSolicitud){
  const s = (state.solicitudes || []).find(x => x.codigoSolicitud === codigoSolicitud);
  if (!s) return;

  await loadPlantillasIfNeeded();
  state.view = 'publicacionesNuevas';
  seleccionarCategoriaPubNueva(s.categoria);
  state.pubNueva.solicitudOrigen = codigoSolicitud;
  state.pubNueva.metaSolicitud = { cantidadSkus: Number(s.cantidadSkus) || 0, skusCreados: Number(s.skusCreados) || 0 };
  render();
}

async function confirmarCodigoCatalogo(codigoSolicitud, btn){
  const input = document.querySelector(`[data-codigo-catalogo-input="${codigoSolicitud}"]`);
  const codigoCatalogo = (input.value || '').trim();
  if (!codigoCatalogo){
    showToast('Escribí el código de revisión antes de confirmar');
    input.focus();
    return;
  }

  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  try {
    if (!API_URL){
      await new Promise(r => setTimeout(r, 400));
      showToast('Modo demo: se simularía guardar el código y avisar por mail');
      return;
    }
    const json = await jsonpRequest({
      action: 'guardarCodigoCatalogo', codigoSolicitud, codigoCatalogo, usuario: state.currentUser
    });
    if (json.error) throw new Error(json.error);
    showToast('Código guardado ✓ — se avisó por mail');
    await loadSolicitudesIfNeeded(true);
    render();
  } catch (err){
    showToast('Error al guardar el código: ' + err.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}

async function enviarSolicitud(){
  const f = state.nuevaSolicitud;
  if (!f.categoria || !f.motivo || !f.ejecutivoAsignado){
    showToast('Completá categoría, motivo y a quién se asigna antes de enviar');
    return;
  }

  const btn = document.getElementById('btnEnviarSolicitud');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Enviando…';

  try {
    if (!API_URL){
      await new Promise(r => setTimeout(r, 500));
      showToast('Modo demo: se simularía el envío de la solicitud');
      return;
    }
    const json = await jsonpRequest({
      action: 'crearSolicitud',
      categoria: f.categoria, motivo: f.motivo, cantidadSkus: f.cantidadSkus,
      observaciones: f.observaciones, ejecutivoAsignado: f.ejecutivoAsignado,
      usuarioSolicitante: state.currentUser
    });
    if (json.error) throw new Error(json.error);
    showToast(`Solicitud enviada ✓ (${json.codigoSolicitud}) — asignada a ${f.ejecutivoAsignado}`);
    state.nuevaSolicitud = { categoria: '', motivo: '', cantidadSkus: '', observaciones: '', ejecutivoAsignado: '' };
    await loadSolicitudesIfNeeded(true);
    render();
  } catch (err){
    showToast('Error al enviar la solicitud: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

        🔒 ${escapeHtml(c.valorPorDefecto || '(ML lo completa automáticamente)')}
      </div>`;
  } else if (c.tipoControl === 'calculado'){
    // Se deriva de otro campo (ej. cantidad de caracteres del título) — solo lectura, se recalcula solo.
    const referenciado = state.pubNueva.campos[c.referencia] || '';
    control = `
      <div style="padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--ink-soft);">
        📏 ${referenciado.length} caracteres
      </div>`;
  } else if (c.tipoControl === 'select' && c.opciones.length){
    control = `
      <select data-campo-pn="${c.clave}" style="padding:8px 10px; border:1px solid var(--border); border-radius:8px; font:inherit; width:100%;">
        <option value="">Elegir…</option>
        ${c.opciones.map(o => `<option value="${escapeHtml(o)}" ${valorActual===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
      </select>`;
  } else if (c.tipoControl === 'number'){
    control = `<input type="number" data-campo-pn="${c.clave}" value="${escapeHtml(valorActual)}" style="padding:8px 10px; border:1px solid var(--border); border-radius:8px; font:inherit; width:100%;">`;
  } else if (c.clave === 'fotos'){
    control = `<textarea data-campo-pn="${c.clave}" rows="2" placeholder="Pegá las URLs separadas por coma: URL1, URL2, URL3…" style="padding:8px 10px; border:1px solid var(--border); border-radius:8px; font:inherit; width:100%; resize:vertical;">${escapeHtml(valorActual)}</textarea>`;
  } else {
    control = `<textarea data-campo-pn="${c.clave}" rows="2" style="padding:8px 10px; border:1px solid var(--border); border-radius:8px; font:inherit; width:100%; resize:vertical;">${escapeHtml(valorActual)}</textarea>`;
  }

  return `
    <div class="field-row" data-clave-pn="${c.clave}">
      <label>${escapeHtml(c.etiqueta)} ${marcaObligatoria}</label>
      <div>
        ${control}
        ${c.ayuda ? `<div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">${escapeHtml(c.ayuda.slice(0,160))}</div>` : ''}
      </div>
    </div>`;
}

function calcularCompletitudPubNueva(campos){
  let completos = 0;
  const faltantes = [];
  const contables = campos.filter(c => c.tipoControl !== 'calculado');
  contables.forEach(c => {
    const v = state.pubNueva.campos[c.clave];
    const tieneValor = v !== undefined && v !== null && String(v).trim() !== '';
    if (tieneValor) completos++;
    else if (c.obligatorio) faltantes.push(c.etiqueta);
  });
  return { completos, totales: contables.length, faltantes };
}

function attachPublicacionesNuevasEvents(){
  const btnHome = document.getElementById('btnBackHomeDesdePubNueva');
  if (btnHome) btnHome.addEventListener('click', goHome);

  const btnCambiar = document.getElementById('btnCambiarCategoria');
  if (btnCambiar) btnCambiar.addEventListener('click', () => {
    state.pubNueva = { categoria: '', codigoTemp: '', campos: {} };
    state.pubNuevaCodigoTentativo = '';
    state.pubNuevaSugerencia = null;
    render();
  });

  const inputCodigoMadre = document.getElementById('inputCodigoMadre');
  if (inputCodigoMadre){
    let tCodigo;
    inputCodigoMadre.addEventListener('input', e => {
      state.pubNuevaCodigoTentativo = e.target.value;
      clearTimeout(tCodigo);
      tCodigo = setTimeout(buscarSugerenciaCategoria, 500);
    });
  }

  const btnUsarSugerencia = document.getElementById('btnUsarSugerenciaCategoria');
  if (btnUsarSugerencia){
    btnUsarSugerencia.addEventListener('click', () => {
      seleccionarCategoriaPubNueva(state.pubNuevaSugerencia.categoria);

  const selectorCategoria = document.getElementById('selectorCategoria');
  if (selectorCategoria){
    selectorCategoria.addEventListener('change', e => seleccionarCategoriaPubNueva(e.target.value));
  }

  document.querySelectorAll('[data-campo-pn]').forEach(el => {
    let t;
    const actualizar = () => {
      state.pubNueva.campos[el.dataset.campoPn] = el.value;
      clearTimeout(t);
      t = setTimeout(() => { render(); restaurarFoco(el); }, 400);
    };
    el.addEventListener('input', actualizar);
    el.addEventListener('change', actualizar);
  });

  const btnGuardar = document.getElementById('btnGuardarBorrador');
  if (btnGuardar) btnGuardar.addEventListener('click', guardarBorradorPubNueva);

  const btnSiguienteSku = document.getElementById('btnSiguienteSku');
  if (btnSiguienteSku) btnSiguienteSku.addEventListener('click', crearSiguienteSkuDeSolicitud);

  const btnExportar = document.getElementById('btnExportarML');
  if (btnExportar) btnExportar.addEventListener('click', () => {
    document.getElementById('inputPlantillaML').click();
  });
  const inputPlantillaML = document.getElementById('inputPlantillaML');
  if (inputPlantillaML) inputPlantillaML.addEventListener('change', handleExportarExcelML);

  const btnExportarMultiple = document.getElementById('btnExportarMultiple');
  if (btnExportarMultiple) btnExportarMultiple.addEventListener('click', abrirPanelExportarMultiple);
  const inputMultiple = document.getElementById('inputPlantillaMLMultiple');
  if (inputMultiple) inputMultiple.addEventListener('change', handleExportarMultipleExcelML);

  // Vinculación
  const vincMap = { vincMlaReal:'mlaReal', vincTipoPublicacion:'tipoPublicacion', vincCuotas:'cuotas', vincSkuVariante:'skuVariante' };
  Object.keys(vincMap).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', () => {
      state.pubNueva.vinculacion[vincMap[id]] = el.value;
      if (id === 'vincTipoPublicacion') render(); // para mostrar/ocultar el campo Cuotas
    });
  });
  const btnVincular = document.getElementById('btnVincular');
  if (btnVincular) btnVincular.addEventListener('click', vincularPublicacionNueva);
}

// Como renderPublicacionesNuevas() re-renderiza todo el HTML (para
// refrescar el contador de completitud en vivo), el foco del campo que se
// estaba editando se pierde. Lo restauramos por su atributo data-campo-pn.
function restaurarFoco(elOriginal){
  const clave = elOriginal.dataset.campoPn;
  const el = document.querySelector(`[data-campo-pn="${clave}"]`);
  if (el) el.focus();
}

async function buscarSugerenciaCategoria(){
  const codigo = state.pubNuevaCodigoTentativo.trim();
  if (!codigo){ state.pubNuevaSugerencia = null; render(); return; }

  if (!API_URL){
    // Demo: simulamos una coincidencia si el código contiene un guion.
    state.pubNuevaSugerencia = codigo.includes('-')
      ? { categoria: 'Tiras de LED', prefijo: codigo.split('-').slice(0,-1).join('-'),
          coincidencias: [{ sku: codigo.split('-').slice(0,-1).join('-')+'-a1', origen: 'Mercado Libre (demo)' }], buscado: true }
      : { categoria: null, buscado: true, coincidencias: [] };
    render();
    document.getElementById('inputCodigoMadre')?.focus();
    return;
  }

  try {
    const json = await jsonpRequest({ action: 'sugerirCategoriaPorCodigo', codigo });
    if (json.error) throw new Error(json.error);
    state.pubNuevaSugerencia = { ...json, buscado: true };
  } catch (err){
    state.pubNuevaSugerencia = null;
  }
  render();
  const el = document.getElementById('inputCodigoMadre');
  if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function seleccionarCategoriaPubNueva(categoria){
  if (!categoria) return;
  state.pubNueva = { categoria, codigoTemp: '', campos: {}, vinculacion: {}, estadoBorrador: '' };
  // Si venías de escribir un código madre, lo llevamos como SKU inicial.
  if (state.pubNuevaCodigoTentativo){
    state.pubNueva.campos.sku = state.pubNuevaCodigoTentativo.trim();
  }
  // Los campos "fijo" (ej. Cargo por vender) vienen predeterminados por
  // ML según la cuenta/categoría — se auto-completan, no los llena el usuario.
  const camposCat = (state.plantillas.camposPorCategoria[categoria] || []);
  camposCat.forEach(c => {
    if (c.tipoControl === 'fijo' && c.valorPorDefecto){
      state.pubNueva.campos[c.clave] = c.valorPorDefecto;
    }
  });
  render();
}

/**

 * solicitud (mantiene categoría, solicitudOrigen y el contador de
 * progreso) — sin obligar, solo da continuidad rápida cuando pediste

function crearSiguienteSkuDeSolicitud(){
  const categoria = state.pubNueva.categoria;
  const solicitudOrigen = state.pubNueva.solicitudOrigen;
  const meta = state.pubNueva.metaSolicitud;

  state.pubNueva = { categoria, codigoTemp: '', campos: {}, vinculacion: {}, estadoBorrador: '', solicitudOrigen, metaSolicitud: meta };

  const camposCat = (state.plantillas.camposPorCategoria[categoria] || []);
  camposCat.forEach(c => {
    if (c.tipoControl === 'fijo' && c.valorPorDefecto){
      state.pubNueva.campos[c.clave] = c.valorPorDefecto;
    }
  });
  showToast(`Listo para el SKU ${meta.skusCreados + 1} de ${meta.cantidadSkus}`);

async function guardarBorradorPubNueva(){
  const btn = document.getElementById('btnGuardarBorrador');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  try {
    if (!API_URL){
      await new Promise(r => setTimeout(r, 500));
      showToast('Modo demo: se simularía el guardado del borrador');
      return;
    }
    const json = await jsonpRequest({
      action: 'guardarPublicacionNueva',
      categoria: state.pubNueva.categoria,
      codigoTemp: state.pubNueva.codigoTemp,
      campos: JSON.stringify(state.pubNueva.campos),
      usuario: state.currentUser,
      solicitudOrigen: state.pubNueva.solicitudOrigen || ''
    });
    if (json.error) throw new Error(json.error);
    const eraNuevo = !state.pubNueva.codigoTemp;
    state.pubNueva.codigoTemp = json.codigoTemp;
    if (eraNuevo && state.pubNueva.metaSolicitud) state.pubNueva.metaSolicitud.skusCreados++;
    showToast(
      `Guardado ✓ (${json.completos}/${json.totales} campos) — ` +
      (json.estado === 'Completa' ? 'lista para exportar' : `faltan ${json.faltantesObligatorios.length} obligatorio(s)`)
    );
    render();
  } catch (err){
    showToast('Error al guardar: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

/* ============================================================================
   EXPORTACIÓN AL EXCEL ORIGINAL DE MERCADO LIBRE
   ============================================================================
   No reconstruimos el formato de ML a mano (cambia por categoría y con el
   tiempo): tomamos el archivo real que el usuario descargó de ML —tal cual,
   sin tocar— y solo completamos los valores en las celdas correctas, usando
   la columna Excel exacta que guardamos en PlantillasPublicacion al parsear
   ese mismo archivo. Así se conserva el formato, las validaciones y todo lo
   que ML espera recibir de vuelta.
   ========================================================================== */
async function handleExportarExcelML(e){
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  if (typeof XLSX === 'undefined'){
    showToast('No se pudo cargar el lector de Excel (revisá tu conexión)');
    return;
  }

  const categoria = state.pubNueva.categoria;
  const campos = (state.plantillas.camposPorCategoria[categoria] || []);
  if (campos.length === 0){
    showToast('No hay plantilla cargada para esta categoría');
    return;
  }

  showToast('Abriendo tu planilla de Mercado Libre…');
  try {
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array', cellStyles: true });

    if (!wb.SheetNames.includes(categoria)){
      showToast(`Esa planilla no tiene una pestaña "${categoria}". ¿Es el archivo de ML de esta categoría?`);
      return;
    }
    const ws = wb.Sheets[categoria];
    const filaDestino = escribirFilaEnPlanilla(ws, campos, state.pubNueva.campos);

    const nombreArchivo = `ML_${categoria.replace(/\s+/g,'_')}_${state.pubNueva.campos.sku || state.pubNueva.codigoTemp || 'export'}.xlsx`;
    XLSX.writeFile(wb, nombreArchivo);
    showToast(`Exportado ✓ — fila ${filaDestino} de la pestaña "${categoria}"`);
  } catch (err){
    showToast('Error al exportar: ' + err.message);
  }
}

/**
 * Escribe UN producto en la primera fila libre de la planilla (desde la
 * fila 9), usando la columna del Título como "señal" de fila vacía.
 * Devuelve el número de fila (1-indexed) donde quedó escrito. Reutilizada
 * tanto por la exportación de un solo producto como por la múltiple.
 */
function escribirFilaEnPlanilla(ws, campos, camposValores, filaDesde){
  const campoTitulo = campos.find(c => c.clave === 'titulo');
  const colTitulo = campoTitulo ? XLSX.utils.decode_col(campoTitulo.columnaExcel) : 1;

  let filaDestino = filaDesde || 9; // 1-indexed, como en el Excel real
  while (true){
    const ref = XLSX.utils.encode_cell({ r: filaDestino - 1, c: colTitulo });
    const celda = ws[ref];
    if (!celda || celda.v === undefined || celda.v === '') break;
    filaDestino++;
    if (filaDestino > 10000) throw new Error('No se encontró una fila libre en la planilla');
  }

  campos.forEach(c => {
    if (!c.columnaExcel) return;
    let valor = camposValores[c.clave];
    if (c.tipoControl === 'calculado'){
      valor = String(camposValores[c.referencia] || '').length;
    }
    if (valor === undefined || valor === null || valor === '') return;

    const col = XLSX.utils.decode_col(c.columnaExcel);
    const ref = XLSX.utils.encode_cell({ r: filaDestino - 1, c: col });
    const esNumero = c.tipoControl === 'number' || c.tipoControl === 'calculado';
    const valorFinal = esNumero && !isNaN(Number(valor)) ? Number(valor) : String(valor);

    if (ws[ref]){
      ws[ref].v = valorFinal;
      ws[ref].t = typeof valorFinal === 'number' ? 'n' : 's';
      delete ws[ref].f;
    } else {
      ws[ref] = { v: valorFinal, t: typeof valorFinal === 'number' ? 'n' : 's' };
    }
  });

  return filaDestino;
}

async function handleExportarMultipleExcelML(e){
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const seleccionados = state._borradoresAExportar || [];
  if (!seleccionados.length) return;

  const categoria = state.pubNueva.categoria;
  const campos = (state.plantillas.camposPorCategoria[categoria] || []);

  showToast(`Exportando ${seleccionados.length} publicaciones…`);
  try {
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array', cellStyles: true });
    if (!wb.SheetNames.includes(categoria)){
      showToast(`Esa planilla no tiene una pestaña "${categoria}".`);
      return;
    }
    const ws = wb.Sheets[categoria];

    let filaSiguiente = 9;
    seleccionados.forEach(b => {
      filaSiguiente = escribirFilaEnPlanilla(ws, campos, b.campos, filaSiguiente) + 1;
    });

    const nombreArchivo = `ML_${categoria.replace(/\s+/g,'_')}_lote_${seleccionados.length}.xlsx`;
    XLSX.writeFile(wb, nombreArchivo);
    showToast(`Exportado ✓ — ${seleccionados.length} publicaciones en "${categoria}"`);
    document.getElementById('panelExportarMultiple').innerHTML = '';
  } catch (err){
    showToast('Error al exportar: ' + err.message);
  }
}

async function vincularPublicacionNueva(){
  const v = state.pubNueva.vinculacion;
  if (!state.pubNueva.codigoTemp){
    showToast('Guardá un borrador antes de vincular');
    return;
  }
  if (!v.mlaReal || !v.tipoPublicacion){
    showToast('Completá el MLA real y el tipo de publicación antes de vincular');
    return;
  }

  const btn = document.getElementById('btnVincular');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Vinculando…';

  try {
    if (!API_URL){
      await new Promise(r => setTimeout(r, 500));
      showToast('Modo demo: se simularía la vinculación al optimizador');
      state.pubNueva.estadoBorrador = 'Vinculada';
      render();
      return;
    }
    const json = await jsonpRequest({
      action: 'vincularPublicacion', codigoTemp: state.pubNueva.codigoTemp,
      mlaReal: v.mlaReal, tipoPublicacion: v.tipoPublicacion, cuotas: v.cuotas,
      skuVariante: v.skuVariante, usuario: state.currentUser
    });
    if (json.error) throw new Error(json.error);
    showToast('Vinculada ✓ — ya está en el flujo normal del optimizador');
    state.pubNueva.estadoBorrador = 'Vinculada';
    render();
  } catch (err){
    showToast('Error al vincular: ' + err.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}
