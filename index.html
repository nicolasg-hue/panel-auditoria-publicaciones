/* ---- DETAIL ---- */
function currentFilteredList(){
  // Usamos siempre los filtros vigentes para que "siguiente/anterior" navegue
  // dentro del subconjunto que el usuario está revisando.
  return filteredRows();
}
function renderDetail(){
  const list = currentFilteredList();
  if (!list.length){
    return `<div class="empty-state"><h3>No hay publicaciones para mostrar</h3></div>`;
  }
  const idx = Math.min(state.currentIndex, list.length - 1);
  const item = list[idx];
  const campos = state.config.campos.filter(c => c.canal === 'Ambos' || c.canal === state.canal);

  const secciones = {};
  campos.forEach(c => { (secciones[c.seccion] = secciones[c.seccion] || []).push(c); });

  const score = Number(item.Score) || 0;
  const circumference = 2 * Math.PI * 34;
  const dash = circumference * (score/100);
  const nivelPrioridad = Number(item._prioridad || 0);
  const colorPrioridadDetalle = item._prioridadColor && nivelPrioridad > 0 ? item._prioridadColor : PRIORIDAD_COLOR_FALLBACK[nivelPrioridad];
  const chipPrioridad = nivelPrioridad > 0
    ? `<span class="chip" style="display:inline-flex; align-items:center; gap:6px;"><span class="prioridad-dot" style="background:${colorPrioridadDetalle}"></span>Prioridad: ${escapeHtml(item._prioridadLabel)} (#${nivelPrioridad})</span>`
    : `<span class="chip" style="display:inline-flex; align-items:center; gap:6px; opacity:.6;"><span class="prioridad-dot" style="background:${PRIORIDAD_COLOR_FALLBACK[0]}"></span>Sin prioridad</span>`;

  return `
    <div class="detail-header">
      <div class="id-block">
        <div class="mla">${escapeHtml(item.MLA_SKU || '')} · SKU ${escapeHtml(item.SKU || '')}</div>
        <h2>${escapeHtml(item.Producto || '')}</h2>
        <div class="chips">
          ${chipPrioridad}
          <span class="chip">${escapeHtml(item.Categoria || 'Sin categoría')}</span>
          <span class="badge ${ESTADO_CLASS[item.Estado]||'pendiente'}">${item.Estado || 'Pendiente'}</span>
          <span style="display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--ink-faint); border-radius:999px; padding:4px 6px 4px 12px; font-size:12.5px; color:var(--ink-soft);">
            👤 Ejecutivo:
            <select id="fichaResponsable" title="Click para asignar o cambiar el ejecutivo responsable" style="border:1px solid var(--border); border-radius:6px; background:var(--surface); font:inherit; font-weight:600; color:var(--ink); cursor:pointer; padding:4px 8px;">
              <option value="">Sin asignar</option>
              ${(state.config.listas.usuarios||[]).map(u => `<option value="${escapeHtml(u)}" ${item.Responsable===u?'selected':''}>${escapeHtml(u)}</option>`).join('')}
            </select>
          </span>
          <span class="chip">Última revisión: ${fmtDate(item.FechaUltimaRevision)}</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:20px;">
        <div class="score-gauge">
          <svg width="88" height="88" viewBox="0 0 88 88">
            <circle cx="44" cy="44" r="34" fill="none" stroke="var(--surface-2)" stroke-width="8"/>
            <circle id="scoreRing" cx="44" cy="44" r="34" fill="none" stroke="${score>=80?'var(--ok)':score>=50?'var(--warn)':'var(--danger)'}"
              stroke-width="8" stroke-linecap="round"
              stroke-dasharray="${dash} ${circumference}"/>
          </svg>
          <div class="value" id="scoreValue">${score}%</div>
          <div class="label">Score</div>
        </div>
        <button class="confirm-btn" id="btnConfirm" ${item.Estado==='Optimizada' ? 'disabled' : ''}>
          ✅ Confirmar optimización
        </button>
      </div>
    </div>

    <div class="checklist-sections">
      ${Object.keys(secciones).map(sec => renderSectionCard(sec, secciones[sec], item)).join('')}
    </div>

    <div class="nav-footer">
      <div class="group">
        <button class="nav-btn" id="btnPrev" ${idx===0?'disabled':''}>← Anterior</button>
        <button class="nav-btn" id="btnNext" ${idx===list.length-1?'disabled':''}>Siguiente →</button>
      </div>
      <div class="group">
        <button class="nav-btn" id="btnNextPending">Siguiente pendiente</button>
        <button class="nav-btn primary" id="btnToList">Volver al listado</button>
      </div>
    </div>
  `;
}

function renderSectionCard(sec, campos, item){
  const selectCount = campos.filter(c=>c.tipoControl==='select').length;
  const okCount = campos.filter(c=>c.tipoControl==='select' && item[c.clave]==='OK').length;
  return `
    <div class="section-card">
      <h3>${escapeHtml(sec)} ${selectCount ? `<span class="count">${okCount}/${selectCount} OK</span>` : ''}</h3>
      ${campos.map(c => renderField(c, item)).join('')}
    </div>`;
}

// Claves de checklist que representan imágenes o clips de video: son las
// únicas que ofrecen el botón "Generar prompt IA" (Nano Banana 2 / Omni Flash).
function esCampoAsset(clave){
  return clave.startsWith('img_') || clave.startsWith('clip_');
}
// Claves de texto que representan título/descripción reales: ofrecen el
// botón "✨ Sugerir" para reescribirlas con IA según reglas de plataforma.
function esCampoSugerible(clave){
  return clave === 'titulo_texto' || clave === 'desc_producto';
}

function renderField(c, item){
  const value = item[c.clave] ?? '';
  const mostrarBotonAsset = c.tipoControl === 'select' && esCampoAsset(c.clave);
  const promptBtn = mostrarBotonAsset ? `
    <button class="ai-prompt-btn" data-asset-btn="${c.clave}">
      ${c.clave.startsWith('clip_') ? '🎬' : '🖼️'} Generar prompt IA
    </button>` : '';
  const promptBox = mostrarBotonAsset ? `
    <div class="ai-prompt-box" id="prompt-box-${c.clave}" data-asset-box="${c.clave}"></div>` : '';

  if (c.tipoControl === 'select'){
    const opts = c.opciones.length ? c.opciones : ['OK','Pendiente','Incorrecto'];
    return `
      <div class="field-row" data-clave="${c.clave}">
        <label>${escapeHtml(c.etiqueta)}</label>
        <div class="field-content">
          <div class="field-content-top">
            <div class="chip-toggle" data-clave="${c.clave}">
              ${opts.map(o => `<button data-val="${escapeHtml(o)}" class="${value===o?'active':''}">${escapeHtml(o)}</button>`).join('')}
              <span class="save-dot" data-savedot="${c.clave}"></span>
            </div>
            ${promptBtn}
          </div>
          ${promptBox}
        </div>
      </div>`;
  }

  const sugerible = esCampoSugerible(c.clave);
  const suggBtn = sugerible ? `<button class="ai-prompt-btn" data-suggest-btn="${c.clave}">✨ Sugerir</button>` : '';
  const suggBox = sugerible ? `<div class="ai-prompt-box" id="suggest-box-${c.clave}" data-suggest-box="${c.clave}"></div>` : '';
  const contador = c.clave === 'titulo_texto'
    ? `<span class="char-counter" id="char-counter-titulo_texto"></span>` : '';

  return `
    <div class="field-row" data-clave="${c.clave}">
      <label>${escapeHtml(c.etiqueta)}</label>
      <div class="field-content">
        <div class="field-content-top" style="align-items:flex-start;">
          <div style="position:relative; flex:1; min-width:220px;">
            <textarea data-clave="${c.clave}" placeholder="Escribir observación…">${escapeHtml(value)}</textarea>
            <span class="save-dot" data-savedot="${c.clave}" style="position:absolute; right:8px; top:8px;"></span>
          </div>
          ${suggBtn}
        </div>
        ${contador}
        ${suggBox}
      </div>
    </div>`;
}

function attachDetailEvents(){
  const list = currentFilteredList();
  const idx = Math.min(state.currentIndex, list.length - 1);
  const item = list[idx];

  document.getElementById('btnToList').addEventListener('click', () => goList(state.canal));
  document.getElementById('btnPrev').addEventListener('click', () => { state.currentIndex = idx - 1; render(); });
  document.getElementById('btnNext').addEventListener('click', () => { state.currentIndex = idx + 1; render(); });
  document.getElementById('btnNextPending').addEventListener('click', () => {
    const next = list.findIndex((r,i) => i > idx && r.Estado !== 'Optimizada');
    const fallback = list.findIndex(r => r.Estado !== 'Optimizada');
    state.currentIndex = next > -1 ? next : (fallback > -1 ? fallback : idx);
    render();
  });
  document.getElementById('btnConfirm').addEventListener('click', () => confirmOptimization(item));
  document.getElementById('fichaResponsable').addEventListener('change', e => {
    item.Responsable = e.target.value;
    saveField(item, 'Responsable', e.target.value);
  });

  document.querySelectorAll('.chip-toggle').forEach(group => {
    group.addEventListener('click', e => {
      const btn = e.target.closest('button[data-val]');
      if (!btn) return;
      const clave = group.dataset.clave;
      const yaEstabaActivo = btn.classList.contains('active');
      // Re-clickear el mismo botón ya activo lo "desconfirma" (vuelve a
      // estado sin definir), en vez de quedar pegado para siempre.
      const valor = yaEstabaActivo ? '' : btn.dataset.val;
      group.querySelectorAll('button').forEach(b => b.classList.toggle('active', !yaEstabaActivo && b===btn));
      saveField(item, clave, valor);
    });
  });

  document.querySelectorAll('textarea[data-clave]').forEach(ta => {
    let t;
    ta.addEventListener('input', () => {
      clearTimeout(t);
      const dot = document.querySelector(`[data-savedot="${ta.dataset.clave}"]`);
      if (dot) dot.className = 'save-dot saving';
      t = setTimeout(() => saveField(item, ta.dataset.clave, ta.value), 500);
    });
  });

  document.querySelectorAll('[data-asset-btn]').forEach(btn => {
    btn.addEventListener('click', () => generateAssetPrompt(item, btn.dataset.assetBtn, btn));
  });

  document.querySelectorAll('[data-suggest-btn]').forEach(btn => {
    btn.addEventListener('click', () => suggestText(item, btn.dataset.suggestBtn, btn));
  });

  const tituloTa = document.querySelector('textarea[data-clave="titulo_texto"]');
  if (tituloTa){
    updateCharCounter(tituloTa.value.length);
    tituloTa.addEventListener('input', () => updateCharCounter(tituloTa.value.length));
  }
}

/**
 * ML: recomendado ≤60 caracteres (obligatorio, límite duro de la plataforma).
 * Web: recomendado 50-60 caracteres pensando en el snippet de búsqueda.
 */
function updateCharCounter(len){
  const el = document.getElementById('char-counter-titulo_texto');
  if (!el) return;
  let cls, texto;
  if (state.canal === 'Web'){
    if (len === 0){ cls='warn'; texto=`${len} caracteres — recomendado 50-60`; }
    else if (len < 50){ cls='warn'; texto=`${len}/60 — un poco corto, ideal 50-60`; }
    else if (len <= 60){ cls='ok'; texto=`${len}/60 ✔ largo ideal para SEO`; }
    else { cls='danger'; texto=`${len}/60 — se corta en el snippet de búsqueda`; }
  } else {
    if (len === 0){ cls='warn'; texto=`${len}/60 caracteres`; }
    else if (len <= 60){ cls='ok'; texto=`${len}/60 ✔`; }
    else { cls='danger'; texto=`${len}/60 — supera el límite de Mercado Libre`; }
  }
  el.textContent = texto;
  el.className = 'char-counter ' + cls;
}

/* ============================================================================
   SUGERENCIA DE TÍTULO / DESCRIPCIÓN CON IA
   ============================================================================
   Aplica a los campos titulo_texto y desc_producto: la IA propone una
   versión mejorada según las reglas de la plataforma (ML o Web) y el
   contexto de marca cargado en ia_config. El usuario elige usarla o
   descartarla — nunca se pisa el campo sin confirmación.
   ========================================================================== */
async function suggestText(item, clave, btn){
  const tipo = clave === 'titulo_texto' ? 'titulo' : 'descripcion';
  const textoBase = String(item[clave] || '').trim();
  const box = document.getElementById('suggest-box-' + clave);

  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="mini-spinner"></span> Generando…';
  box.classList.remove('error');
  box.classList.add('open');
  box.textContent = 'Generando sugerencia…';

  try {
    let sugerencia;
    if (!API_URL){
      await new Promise(r => setTimeout(r, 650));
      sugerencia = tipo === 'titulo'
        ? (state.canal === 'Web'
            ? `${item.Categoria} | ${item.Producto}`
            : `${item.Producto} - ${item.Categoria}`).slice(0, 60)
        : `[DEMO] Descripción optimizada de "${item.Producto}" para ${state.canal === 'Web' ? 'Web/SEO-GEO' : 'Mercado Libre'}, basada en tu texto base. Conectá API_URL y GEMINI_API_KEY para generar contenido real.`;
    } else {
      const json = await jsonpRequest({
        action: 'suggestText', canal: state.canal, tipo,
        textoBase, producto: item.Producto, categoria: item.Categoria
      });
      if (json.error) throw new Error(json.error);
      sugerencia = json.sugerencia;
    }

    box.innerHTML = `
      <div>${escapeHtml(sugerencia)}</div>
      <div class="suggest-actions">
        <button type="button" class="use-btn">Usar esta sugerencia</button>
        <button type="button" class="discard-btn">Descartar</button>
      </div>`;
    box.querySelector('.use-btn').addEventListener('click', () => {
      const ta = document.querySelector(`textarea[data-clave="${clave}"]`);
      ta.value = sugerencia;
      if (clave === 'titulo_texto') updateCharCounter(sugerencia.length);
      saveField(item, clave, sugerencia);
      box.classList.remove('open');
    });
    box.querySelector('.discard-btn').addEventListener('click', () => {
      box.classList.remove('open');
    });
  } catch (err){
    box.classList.add('error');
    box.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
}

/* ============================================================================
   ASIGNACIÓN MASIVA DE EJECUTIVO (Excel de 2 columnas: MLA | Ejecutivo)
   ========================================================================== */
const LOTE_ASIGNACION_MASIVA = 80; // pares por request, para no exceder el largo de URL en JSONP

async function handleAsignacionMasivaFile(e){
  const file = e.target.files[0];
  e.target.value = ''; // permite volver a elegir el mismo archivo después
  if (!file) return;

  if (typeof XLSX === 'undefined'){
    showToast('No se pudo cargar el lector de Excel (revisá tu conexión)');
    return;
  }

  showToast('Leyendo archivo…');
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, { type: 'array' });
  const hoja = wb.Sheets[wb.SheetNames[0]];
  const filas = XLSX.utils.sheet_to_json(hoja, { header: 1, defval: '' });

  // Se asume: fila 1 = encabezado (se descarta), columna A = MLA, columna B = Ejecutivo.
  const pares = filas.slice(1)
    .map(f => ({ mlaSku: String(f[0] || '').trim(), ejecutivo: String(f[1] || '').trim() }))
    .filter(p => p.mlaSku && p.ejecutivo);

  if (pares.length === 0){
    showToast('El archivo no tiene filas válidas (esperado: columna A = MLA, columna B = Ejecutivo)');
    return;
  }

  if (!API_URL){
    showToast(`Modo demo: se simularía la asignación de ${pares.length} publicaciones`);
    return;
  }

  const lotes = [];
  for (let i = 0; i < pares.length; i += LOTE_ASIGNACION_MASIVA){
    lotes.push(pares.slice(i, i + LOTE_ASIGNACION_MASIVA));
  }

  let totalActualizados = 0;
  const noEncontrados = [];
  showToast(`Asignando ${pares.length} publicaciones en ${lotes.length} tanda(s)…`);

  for (let i = 0; i < lotes.length; i++){
    try {
      const json = await jsonpRequest({
        action: 'bulkAssignResponsable', canal: state.canal,
        pares: JSON.stringify(lotes[i]), usuario: state.currentUser
      });
      if (json.error) throw new Error(json.error);
      totalActualizados += json.actualizados || 0;
      if (json.noEncontrados) noEncontrados.push(...json.noEncontrados);
    } catch (err){
      showToast(`Error en tanda ${i+1}/${lotes.length}: ${err.message}`);
    }
  }

  showToast(
    `Listo: ${totalActualizados} asignados` +
    (noEncontrados.length ? `, ${noEncontrados.length} MLA no encontrados` : '')
  );
  if (noEncontrados.length){
    console.warn('MLA no encontrados en la asignación masiva:', noEncontrados);
  }

  await loadData(); // refresca todo con los datos reales ya actualizados
}

/* ============================================================================
   GENERADOR DE PROMPTS DE IMÁGENES / VIDEO (Nano Banana 2 / Omni Flash)
   ============================================================================
   Requiere que "Descripción del producto (fuente para IA)" (desc_producto)
   esté cargada: es la fuente de verdad que evita que la IA invente
   materiales, colores o funciones que el producto no tiene.
   ========================================================================== */
async function generateAssetPrompt(item, clave, btn){
  const descripcionBase = String(item.desc_producto || '').trim();
  const box = document.getElementById('prompt-box-' + clave);

  if (!descripcionBase){
    showToast('Completá primero "Descripción del producto" para generar el prompt');
    const target = document.querySelector('textarea[data-clave="desc_producto"]');
    if (target){ target.scrollIntoView({behavior:'smooth', block:'center'}); target.focus(); }
    return;
  }

  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="mini-spinner"></span> Generando…';
  box.classList.remove('error');
  box.classList.add('open');
  box.textContent = 'Generando prompt…';

  try {
    let promptText;
    if (!API_URL){
      await new Promise(r => setTimeout(r, 650));
      promptText = `[DEMO] Prompt de "${clave}" para "${item.Producto}", basado en: "${descripcionBase.slice(0,90)}…". Conectá API_URL y GEMINI_API_KEY para generar el prompt real.`;
    } else {
      const json = await jsonpRequest({
        action: 'generatePrompt', canal: state.canal, tipoAsset: clave,
        producto: item.Producto, categoria: item.Categoria,
        descripcionBase: descripcionBase
      });
      if (json.error) throw new Error(json.error);
      promptText = json.prompt;
    }

    box.innerHTML = `${escapeHtml(promptText)}<br><button class="copy-mini" type="button">📋 Copiar prompt</button>`;
    box.querySelector('.copy-mini').addEventListener('click', () => {
      navigator.clipboard.writeText(promptText).then(() => showToast('Prompt copiado ✔'));
    });
  } catch (err){
    box.classList.add('error');
    box.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
}

/* ============================================================================
   GUARDADO (autoguardado inmediato, sin botón "Guardar")
   ========================================================================== */
async function saveField(item, clave, valor){
  const dot = document.querySelector(`[data-savedot="${clave}"]`);
  if (dot) dot.className = 'save-dot saving';

  // Actualización optimista en memoria
  item[clave] = valor;
  recalcClientScore(item);
  updateScoreUI(item);

  // Si una publicación optimizada deja de tener todo OK, preguntamos
  if (item.Estado === 'Optimizada' && Number(item.Score) < 100){
    const cambiar = await confirmDialog(
      'Esta publicación dejará de estar optimizada. ¿Desea cambiar su estado a "Requiere cambios"?'
    );
    if (cambiar) await setStatus(item, 'Requiere cambios');
  }

  try {
    if (API_URL){
      const json = await jsonpRequest({
        action: 'updateField', canal: state.canal, row: item._row,
        mlaSku: item.MLA_SKU, campo: clave, valor: valor, usuario: state.currentUser
      });
      if (json.error) throw new Error(json.error);
      item.Score = json.score;
      updateScoreUI(item);
    }
    if (dot) dot.className = 'save-dot saved';
  } catch (err){
    if (dot) dot.className = 'save-dot';
    showToast('No se pudo guardar: ' + err.message);
  }
}

function recalcClientScore(item){
  const campos = state.config.campos.filter(c => c.tipoControl==='select' && (c.canal==='Ambos'||c.canal===state.canal));
  if (!campos.length){ item.Score = 0; return; }
  const ok = campos.filter(c => item[c.clave]==='OK').length;
  item.Score = Math.round((ok/campos.length)*100);
}

function updateScoreUI(item){
  const score = Number(item.Score)||0;
  const valueEl = document.getElementById('scoreValue');
  const ring = document.getElementById('scoreRing');
  if (valueEl) valueEl.textContent = score + '%';
  if (ring){
    const circumference = 2*Math.PI*34;
    ring.setAttribute('stroke-dasharray', `${circumference*(score/100)} ${circumference}`);
    ring.setAttribute('stroke', score>=80?'var(--ok)':score>=50?'var(--warn)':'var(--danger)');
  }
}

async function confirmOptimization(item){
  if (!String(item.desc_producto || '').trim()){
    showToast('Completá "Descripción (texto real / fuente para IA)" antes de confirmar');
    const target = document.querySelector('textarea[data-clave="desc_producto"]');
    if (target){ target.scrollIntoView({behavior:'smooth', block:'center'}); target.focus(); }
    return;
  }
  await setStatus(item, 'Optimizada', true);
}

async function setStatus(item, estado, esConfirmacion){
  const estadoAnterior = item.Estado;
  item.Estado = estado;
  item.FechaUltimaRevision = new Date().toISOString();
  item.UltimoUsuario = state.currentUser;
  render();
  showToast(esConfirmacion ? 'Publicación optimizada ✔' : `Estado actualizado a "${estado}"`);

  try {
    if (API_URL){
      const json = await jsonpRequest({
        action: esConfirmacion ? 'confirmOptimization' : 'setStatus',
        canal: state.canal, row: item._row, mlaSku: item.MLA_SKU,
        estado: estado, usuario: state.currentUser
      });
      if (json.error) throw new Error(json.error);
    }
  } catch (err){
    item.Estado = estadoAnterior;
    showToast('No se pudo actualizar el estado: ' + err.message);
    render();
  }
}

/* ============================================================================
   RESUMEN SEMANAL (informe de actividad por usuario, desde el Historial)
   ========================================================================== */
async function showResumenModal(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal wide">
      <h3>📊 Resumen semanal</h3>
      <div id="resumenBody"><div class="loading-screen" style="padding:40px 0;"><div class="spinner"></div><span>Cargando actividad…</span></div></div>
      <div class="actions"><button class="nav-btn primary" id="btnCerrarResumen">Cerrar</button></div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#btnCerrarResumen').addEventListener('click', () => backdrop.remove());
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });

  try {
    const resumen = API_URL
      ? await (async () => {
          const json = await jsonpRequest({ action: 'getResumen', dias: 7 });
          if (json.error) throw new Error(json.error);
          return json;
        })()
      : buildDemoResumen();

    renderResumen(resumen, backdrop.querySelector('#resumenBody'));
  } catch (err){
    backdrop.querySelector('#resumenBody').innerHTML =
      `<div class="empty-state"><h3>No se pudo cargar el resumen</h3><p>${escapeHtml(err.message)}</p></div>`;
  }
}

function renderResumen(resumen, container){
  if (!resumen.porUsuario.length){
    container.innerHTML = `
      <p class="resumen-range">Del ${resumen.desde} al ${resumen.hasta}</p>
      <div class="empty-state"><h3>Sin actividad registrada</h3><p>Todavía no hay ediciones en el Historial en este rango.</p></div>`;
    return;
  }
  container.innerHTML = `
    <p class="resumen-range">Del ${resumen.desde} al ${resumen.hasta} · últimos 7 días</p>
    <table class="resumen-table">
      <thead>
        <tr>
          <th>Usuario</th>
          <th style="text-align:right">Optimizadas ML</th>
          <th style="text-align:right">Optimizadas Web</th>
          <th style="text-align:right">Total optimizadas</th>
          <th style="text-align:right">Ediciones totales</th>
        </tr>
      </thead>
      <tbody>
        ${resumen.porUsuario.map(u => `
          <tr>
            <td>${escapeHtml(u.usuario)}</td>
            <td class="num">${u.optimizadasML}</td>
            <td class="num">${u.optimizadasWeb}</td>
            <td class="num" style="font-weight:700">${u.totalOptimizadas}</td>
            <td class="num">${u.ediciones}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div class="resumen-total">
      <span>Total del equipo</span>
      <span>${resumen.totalOptimizadas} optimizadas · ${resumen.totalEdiciones} ediciones</span>
    </div>`;
}

// Datos de ejemplo para el modo demo (sin API_URL no hay Historial real)
function buildDemoResumen(){
  const hoy = new Date();
  const hace7 = new Date(hoy.getTime() - 7*86400000);
  const fmt = d => d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
  const porUsuario = [
    { usuario:'Carla', optimizadasML:4, optimizadasWeb:2, totalOptimizadas:6, ediciones:31 },
    { usuario:'Nicolás', optimizadasML:3, optimizadasWeb:3, totalOptimizadas:6, ediciones:28 },
    { usuario:'Martín', optimizadasML:2, optimizadasWeb:1, totalOptimizadas:3, ediciones:15 },
    { usuario:'Sofía', optimizadasML:1, optimizadasWeb:0, totalOptimizadas:1, ediciones:9 }
  ];
  return {
    desde: fmt(hace7), hasta: fmt(hoy), porUsuario,
    totalOptimizadas: porUsuario.reduce((a,u)=>a+u.totalOptimizadas,0),
    totalEdiciones: porUsuario.reduce((a,u)=>a+u.ediciones,0)
  };
}

/* ============================================================================
   MODAL DE CONFIRMACIÓN (usado para el cambio de estado post-edición)
   ========================================================================== */
function confirmDialog(message){
  return new Promise(resolve => {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Confirmar cambio de estado</h3>
        <p>${escapeHtml(message)}</p>
        <div class="actions">
          <button class="nav-btn" id="mdNo">No, dejar como está</button>
          <button class="nav-btn primary" id="mdYes">Sí, cambiar estado</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    backdrop.querySelector('#mdYes').addEventListener('click', () => { backdrop.remove(); resolve(true); });
    backdrop.querySelector('#mdNo').addEventListener('click', () => { backdrop.remove(); resolve(false); });
  });
}
